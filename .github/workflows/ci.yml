# Lint and build on every push and pull request. The packaged add-on is
# attached to each run under "Artifacts" for quick testing.
name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Lint
        run: npx --yes web-ext@10 lint --self-hosted=false --warnings-as-errors

      - name: Build
        run: npx --yes web-ext@10 build

      - uses: actions/upload-artifact@v4
        with:
          name: second-thought-${{ github.sha }}
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
