# Release: push a tag that matches the manifest version, e.g.
#   git tag v1.0.1 && git push origin v1.0.1
# This lints, builds, publishes a GitHub Release with the zip, and (if the
# AMO_JWT_ISSUER / AMO_JWT_SECRET secrets are set) submits the version to
# addons.mozilla.org for review.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match manifest version ${version}. Bump \"version\" in manifest.json and tag v<version>."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Lint
        run: npx --yes web-ext@10 lint --self-hosted=false --warnings-as-errors

      - name: Build
        run: npx --yes web-ext@10 build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" web-ext-artifacts/*.zip \
            --title "Second Thought ${VERSION}" --generate-notes --verify-tag

      - name: Submit to addons.mozilla.org
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::notice::AMO API keys not set; skipping store submission."
            exit 0
          fi
          # Submits for review and returns; Mozilla emails you when it's live.
          npx --yes web-ext@10 sign --channel=listed --approval-timeout=0 \
            --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"
